name: Link check

on:
  pull_request:
    paths: [data/resources.json]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Check links added by the pull request
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python generate.py --check-links --since "origin/${{ github.base_ref }}"
      - name: Check all links
        if: github.event_name != 'pull_request'
        run: python generate.py --check-links
