name: Link check

on:
  pull_request:
    paths: [data/resources.json]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python generate.py --check-links
